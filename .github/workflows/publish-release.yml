name: Публикация релиза прошивки

on:
  workflow_run:
    workflows:
      - Сборка, извлечение и публикация
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Публикация свежесобранной прошивки ESP32
    permissions:
      actions: read
      contents: write
    # После успешного push в main релиз публикуется только при изменении версии прошивки.
    # Сборки, запущенные ботом, поддерживают явный повтор публикации релиза.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Загрузка артефакта прошивки из завершённой сборки
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-main-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          path: ${{ runner.temp }}/firmware-artifact

      - name: Поиск свежесобранной прошивки и вычисление контрольной суммы
        id: compiled
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/firmware-artifact"
          build_dir="$artifact_dir/build-output"

          # Основной workflow также загружает артефакт при обновлении только сайта.
          # Такие артефакты не содержат результатов компиляции и не должны создавать
          # новый релиз со старым образом прошивки.
          if [[ ! -d "$build_dir" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::В этом запуске прошивка не компилировалась; публикация релиза пропускается."
            exit 0
          fi

          mapfile -t binaries < <(
            find "$build_dir" -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Не найден скомпилированный файл *.ino.bin; публикация релиза пропускается."
            exit 0
          fi

          if [[ "${#binaries[@]}" -ne 1 ]]; then
            echo "::error::Ожидался один скомпилированный файл *.ino.bin, найдено: ${#binaries[@]}."
            printf '%s\n' "${binaries[@]}"
            exit 1
          fi

          asset="$artifact_dir/lego_technic_esp32.ino.bin"
          cp "${binaries[0]}" "$asset"
          test -s "$asset"

          (
            cd "$artifact_dir"
            sha256sum lego_technic_esp32.ino.bin > lego_technic_esp32.ino.bin.sha256
          )

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "SHA-256 скомпилированной прошивки:"
          cat "$artifact_dir/lego_technic_esp32.ino.bin.sha256"

      - name: Получение исходного коммита
        if: ${{ steps.compiled.outputs.publish == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Проверка актуальности исходников прошивки в main
        if: ${{ steps.compiled.outputs.publish == 'true' }}
        id: latest_source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          if git diff --quiet "$SOURCE_SHA" origin/main -- lego_technic_esp32; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Эта сборка соответствует текущим исходникам прошивки в main."
          else
            result=$?
            if [[ "$result" -ne 1 ]]; then
              echo "::error::Не удалось сравнить эту сборку с текущими исходниками прошивки в main."
              exit "$result"
            fi
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::В main уже есть более новые исходники прошивки; публикация устаревшего релиза пропускается."
          fi

      - name: Чтение версии прошивки и принятие решения о публикации
        if: ${{ steps.compiled.outputs.publish == 'true' && steps.latest_source.outputs.current == 'true' }}
        id: version
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Версия разработки:[[:space:]]*//p' lego_technic_esp32/lego_technic_esp32.ino | head -n 1 | tr -d '\r')"
          if [[ -z "$version" ]]; then
            echo "::error::Не удалось прочитать версию прошивки из lego_technic_esp32.ino."
            exit 1
          fi

          publish=true
          if [[ "$WORKFLOW_EVENT" == "push" ]]; then
            previous_sketch="$(git show "${SOURCE_SHA}^:lego_technic_esp32/lego_technic_esp32.ino" 2>/dev/null || true)"
            previous_version="$(printf '%s\n' "$previous_sketch" | sed -n 's/^[[:space:]]*\*[[:space:]]*Версия разработки:[[:space:]]*//p' | head -n 1 | tr -d '\r')"

            if [[ -z "$previous_version" ]]; then
              echo "::notice::В родительском коммите нет маркера версии прошивки; этот выпуск считается первым для основного скетча."
            elif [[ "$version" == "$previous_version" ]]; then
              latest_release_name="$(gh release list --limit 1 --json name --jq '.[0].name // ""')"
              latest_release_version="$(printf '%s\n' "$latest_release_name" | sed -nE 's/.* — ([0-9]+\.[0-9]+\.[0-9]+)( \(build [0-9]+\))?$/\1/p')"

              if [[ "$latest_release_version" == "$version" ]]; then
                publish=false
                echo "::notice::Версия прошивки $version уже является последним опубликованным релизом; повторная публикация пропускается."
              else
                echo "::notice::Версия исходников не изменилась относительно родительского коммита, но последний релиз — '$latest_release_name'; публикуется отсутствующий релиз."
              fi
            fi
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Версия прошивки: $version"
      - name: Публикация прошивки как GitHub Release
        if: ${{ steps.compiled.outputs.publish == 'true' && steps.latest_source.outputs.current == 'true' && steps.version.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-build-${{ github.event.workflow_run.id }}
          name: LEGO Technic ESP32 — ${{ steps.version.outputs.value }} (build ${{ github.event.workflow_run.run_number }})
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          make_latest: true
          body: |
            Автоматически собранная прошивка проекта LEGO Technic ESP32.

            Версия: `${{ steps.version.outputs.value }}`.
            Исходный commit: `${{ github.event.workflow_run.head_sha }}`.

            Файл `.ino.bin` предназначен для обновления уже настроенного контроллера через ElegantOTA. Для первоначальной прошивки новой платы через USB используйте инструкции в `firmware/bootstrap/`.

            Контрольная сумма SHA-256 приложена отдельным файлом.
          files: |
            ${{ runner.temp }}/firmware-artifact/lego_technic_esp32.ino.bin
            ${{ runner.temp }}/firmware-artifact/lego_technic_esp32.ino.bin.sha256
          fail_on_unmatched_files: true
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
