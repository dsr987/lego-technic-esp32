name: Publish Firmware Release

on:
  workflow_run:
    workflows:
      - Build, Extract and Deploy
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish freshly compiled ESP32 firmware
    permissions:
      actions: read
      contents: write
    # Successful main pushes may publish only when the firmware version changed.
    # Bot-dispatched builds remain supported for an explicit release retry.
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.login == 'github-actions[bot]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware artifact from the completed build
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware-main-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
          path: ${{ runner.temp }}/firmware-artifact

      - name: Find freshly compiled firmware and calculate checksum
        id: compiled
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/firmware-artifact"
          build_dir="$artifact_dir/build-output"

          # The main workflow also uploads an artifact for site-only updates.
          # Those artifacts do not contain build-output, so they must not create
          # a new release containing an older firmware image.
          if [[ ! -d "$build_dir" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This run did not compile firmware; release publication is skipped."
            exit 0
          fi

          mapfile -t binaries < <(
            find "$build_dir" -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#binaries[@]}" -eq 0 ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No compiled *.ino.bin found; release publication is skipped."
            exit 0
          fi

          if [[ "${#binaries[@]}" -ne 1 ]]; then
            echo "::error::Expected one compiled *.ino.bin; found ${#binaries[@]}."
            printf '%s\n' "${binaries[@]}"
            exit 1
          fi

          asset="$artifact_dir/lego_technic_esp32.ino.bin"
          cp "${binaries[0]}" "$asset"
          test -s "$asset"

          (
            cd "$artifact_dir"
            sha256sum lego_technic_esp32.ino.bin > lego_technic_esp32.ino.bin.sha256
          )

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Compiled firmware SHA-256:"
          cat "$artifact_dir/lego_technic_esp32.ino.bin.sha256"

      - name: Check out the source commit
        if: ${{ steps.compiled.outputs.publish == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ensure this is the newest firmware source on main
        if: ${{ steps.compiled.outputs.publish == 'true' }}
        id: latest_source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

          if git diff --quiet "$SOURCE_SHA" origin/main -- lego_technic_esp32; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "This build matches the current firmware source on main."
          else
            result=$?
            if [[ "$result" -ne 1 ]]; then
              echo "::error::Could not compare this build with the current main firmware source."
              exit "$result"
            fi
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer firmware source is already on main; skipping this older release."
          fi

      - name: Read firmware version and decide whether to publish
        if: ${{ steps.compiled.outputs.publish == 'true' && steps.latest_source.outputs.current == 'true' }}
        id: version
        shell: bash
        env:
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Версия разработки:[[:space:]]*//p' lego_technic_esp32/lego_technic_esp32.ino | head -n 1 | tr -d '\r')"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read firmware version from lego_technic_esp32.ino."
            exit 1
          fi

          publish=true
          if [[ "$WORKFLOW_EVENT" == "push" ]]; then
            previous_sketch="$(git show "${SOURCE_SHA}^:lego_technic_esp32/lego_technic_esp32.ino" 2>/dev/null || true)"
            previous_version="$(printf '%s\n' "$previous_sketch" | sed -n 's/^[[:space:]]*\*[[:space:]]*Версия разработки:[[:space:]]*//p' | head -n 1 | tr -d '\r')"

            if [[ -z "$previous_version" ]]; then
              echo "::notice::The parent commit has no firmware version marker; treating this as the first release from the canonical sketch."
            elif [[ "$version" == "$previous_version" ]]; then
              publish=false
              echo "::notice::Firmware version is unchanged ($version); release publication is skipped."
            fi
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $version"
      - name: Publish firmware as a GitHub Release
        if: ${{ steps.compiled.outputs.publish == 'true' && steps.latest_source.outputs.current == 'true' && steps.version.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware-build-${{ github.event.workflow_run.id }}
          name: LEGO Technic ESP32 — ${{ steps.version.outputs.value }} (build ${{ github.event.workflow_run.run_number }})
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          make_latest: true
          body: |
            Автоматически собранная прошивка проекта LEGO Technic ESP32.

            Версия: `${{ steps.version.outputs.value }}`.
            Исходный commit: `${{ github.event.workflow_run.head_sha }}`.

            Файл `.ino.bin` предназначен для обновления уже настроенного контроллера через ElegantOTA. Для первоначальной прошивки новой платы через USB используйте инструкции в `firmware/bootstrap/`.

            Контрольная сумма SHA-256 приложена отдельным файлом.
          files: |
            ${{ runner.temp }}/firmware-artifact/lego_technic_esp32.ino.bin
            ${{ runner.temp }}/firmware-artifact/lego_technic_esp32.ino.bin.sha256
          fail_on_unmatched_files: true
          token: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
