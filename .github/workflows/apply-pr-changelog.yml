name: Apply PR Version and Changelog

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: apply-pr-changelog-main
  cancel-in-progress: false

jobs:
  apply-release-metadata:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      # Always check out trusted main. Never check out or execute PR head code.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply release label and changelog entry
        env:
          PR_EVENT_PATH: ${{ github.event_path }}
        run: python3 tools/apply_pr_changelog.py

      - name: Commit updated app.cpp
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lego_technic_esp32/app.cpp
          if git diff --cached --quiet; then
            echo "No changelog update needed."
            exit 0
          fi
          git commit -m "chore: update version and changelog for PR #${{ github.event.pull_request.number }}"
          git push origin HEAD:main
