name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lego_technic_esp32/**'
      - 'tools/**'
      - '.github/workflows/**'
      - 'platformio.ini'
      - 'arduino-cli.yaml'
      - 'CHANGELOG.md'
      - 'README.md'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and embed Web GUI assets
        run: |
          set -euo pipefail
          python3 -m py_compile tools/embed_web_gui_assets.py
          python3 tools/embed_web_gui_assets.py
          git diff --exit-code -- lego_technic_esp32/web_page.cpp

      - name: Test battery warning state machine
        run: node tools/test_battery_warnings.js

      - name: Install esptool Python dependencies
        run: python3 -m pip install --upgrade pyserial

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 platform
        run: arduino-cli core install esp32:esp32@2.0.9

      - name: Install firmware libraries
        run: |
          arduino-cli lib install "ESPAsyncWebServer"
          arduino-cli lib install "AsyncTCP"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "ElegantOTA@3.1.0"

      - name: Compile ESP32 firmware
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esp32-build"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --output-dir "$RUNNER_TEMP/esp32-build" \
            lego_technic_esp32

      - name: Report firmware binary size
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t firmware_bins < <(
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#firmware_bins[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one *.ino.bin file; found ${#firmware_bins[@]}."
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f -printf '%f\\n' || true
            exit 1
          fi

          stat -c 'Firmware BIN size: %s bytes (%n)' "${firmware_bins[0]}"
          sha256sum "${firmware_bins[0]}"

  project-audit:
    name: Project Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Embed Web GUI image assets
        run: python3 tools/embed_web_gui_assets.py

      - name: Verify HTML extraction and workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "PASS: YAML syntax #{path}" }' \
            .github/workflows/ci-build-deploy.yml \
            .github/workflows/pull-request-validation.yml

          python3 tools/extract_html.py \
            lego_technic_esp32/web_page.cpp \
            "$RUNNER_TEMP/extracted-index.html"

          if ! cmp -s index.html "$RUNNER_TEMP/extracted-index.html"; then
            echo "::error::index.html differs from HTML extracted from web_page.cpp"
            diff -u index.html "$RUNNER_TEMP/extracted-index.html" || true
            exit 1
          fi

          echo "PASS: index.html exactly matches extracted PAGE_HTML"

      - name: Run project auditor
        run: python3 tools/project_auditor.py

      - name: Test release versioning automation
        run: python3 tools/test_release_automation.py