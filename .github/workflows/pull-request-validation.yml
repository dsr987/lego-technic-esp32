name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate and embed Web GUI assets
        run: |
          set -euo pipefail
          python3 -m py_compile tools/embed_web_gui_assets.py
          python3 tools/embed_web_gui_assets.py
          git diff --exit-code -- lego_technic_esp32/web_page.cpp

      - name: Verify generated GUI and release files are current
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/update_gui_version.py tools/extract_html.py tools/extract_changelog.py tools/update_readme_version.py
          python3 tools/update_gui_version.py
          if grep -q 'PAGE_HTML' lego_technic_esp32/web_page.cpp; then
            html_source="lego_technic_esp32/web_page.cpp"
          elif grep -q 'PAGE_HTML' lego_technic_esp32/app.cpp; then
            html_source="lego_technic_esp32/app.cpp"
          else
            echo "::error::PAGE_HTML not found in web_page.cpp or app.cpp"
            exit 1
          fi
          python3 tools/extract_html.py "$html_source" index.html
          python3 tools/extract_changelog.py lego_technic_esp32/app.cpp CHANGELOG.md
          python3 tools/update_readme_version.py
          git diff --exit-code -- lego_technic_esp32/web_page.cpp index.html CHANGELOG.md README.md

      - name: Test battery warning state machine
        run: node tools/test_battery_warnings.js

      - name: Install esptool Python dependencies
        run: python3 -m pip install --upgrade pyserial

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install ESP32 platform
        run: arduino-cli core install esp32:esp32@2.0.9

      - name: Install firmware libraries
        run: |
          arduino-cli lib install \
            "ESPAsyncWebServer@3.1.0" \
            "AsyncTCP@1.1.4" \
            "ArduinoJson" \
            "Adafruit SSD1306" \
            "Adafruit GFX Library" \
            "Adafruit BusIO" \
            "ESP32Servo" \
            "ElegantOTA@3.1.0"

      - name: Compile ESP32 firmware
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esp32-build"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --output-dir "$RUNNER_TEMP/esp32-build" \
            lego_technic_esp32

      - name: Report firmware binary size
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t firmware_bins < <(
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#firmware_bins[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one *.ino.bin file; found ${#firmware_bins[@]}."
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f -printf '%f\\n' || true
            exit 1
          fi

          stat -c 'Firmware BIN size: %s bytes (%n)' "${firmware_bins[0]}"
          sha256sum "${firmware_bins[0]}"

      - name: Compile OTA bootstrap and verify committed prebuilt image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap-build"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --output-dir "$RUNNER_TEMP/bootstrap-build" \
            firmware/bootstrap/LEGO_Technic_ESP32_Bootstrap
          mapfile -t bootstrap_bins < <(
            find "$RUNNER_TEMP/bootstrap-build" -maxdepth 1 -type f -name '*.ino.bin' -print
          )
          if [[ "${#bootstrap_bins[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one compiled OTA bootstrap *.ino.bin; found ${#bootstrap_bins[@]}."
            exit 1
          fi
          if ! cmp -s "${bootstrap_bins[0]}" firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin; then
            echo "::error::The committed OTA bootstrap image is stale. Rebuild and commit firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin in this PR."
            sha256sum "${bootstrap_bins[0]}" firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin
            exit 1
          fi
          echo "PASS: the committed OTA bootstrap image matches the compiled source."

  project-audit:
    name: Project Static Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Embed Web GUI image assets
        run: python3 tools/embed_web_gui_assets.py

      - name: Verify HTML extraction and workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "PASS: YAML syntax #{path}" }' \
            .github/workflows/ci-build-deploy.yml \
            .github/workflows/pull-request-validation.yml \
            .github/workflows/release-versioning.yml \
            .github/workflows/release-metadata-validation.yml

          python3 tools/extract_html.py \
            lego_technic_esp32/web_page.cpp \
            "$RUNNER_TEMP/extracted-index.html"

          if ! cmp -s index.html "$RUNNER_TEMP/extracted-index.html"; then
            echo "::error::index.html differs from HTML extracted from web_page.cpp"
            diff -u index.html "$RUNNER_TEMP/extracted-index.html" || true
            exit 1
          fi

          echo "PASS: index.html exactly matches extracted PAGE_HTML"

      - name: Run project auditor
        run: python3 tools/project_auditor.py

      - name: Check battery calibration tools syntax
        run: python3 -m py_compile tools/calibrate_battery.py tools/test_calibrate_battery.py

      - name: Test battery calibration calculator
        run: python3 tools/test_calibrate_battery.py

      - name: Test release versioning automation
        run: python3 tools/test_release_automation.py