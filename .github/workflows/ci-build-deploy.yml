
name: Build, Extract and Deploy

on:
  push:
    branches:
      - main
      - feature/four-dc-motors
    paths:
      - 'lego_technic_esp32/**'
      - 'tools/extract_html.py'
      - 'tools/extract_changelog.py'
      - 'tools/update_readme_version.py'
      - 'index.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/ci-build-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Generate files and build ESP32
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select HTML source
        id: html_source
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'PAGE_HTML' lego_technic_esp32/web_page.cpp; then
            echo "file=lego_technic_esp32/web_page.cpp" >> "$GITHUB_OUTPUT"
          elif grep -q 'PAGE_HTML' lego_technic_esp32/app.cpp; then
            echo "file=lego_technic_esp32/app.cpp" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PAGE_HTML not found in web_page.cpp or app.cpp"
            exit 1
          fi

      - name: Extract GUI HTML
        run: |
          python3 tools/extract_html.py \
            "${{ steps.html_source.outputs.file }}" \
            index.html

      - name: Extract CHANGELOG
        run: |
          python3 tools/extract_changelog.py \
            lego_technic_esp32/app.cpp \
            CHANGELOG.md

      - name: Update README version
        run: python3 tools/update_readme_version.py

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 board index
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install ESP32 Core 2.0.9
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9

      - name: Install firmware libraries
        run: |
          set -euo pipefail
          arduino-cli lib install \
            "ESPAsyncWebServer@3.1.0" \
            "AsyncTCP@1.1.4" \
            "ArduinoJson" \
            "Adafruit SSD1306" \
            "Adafruit GFX Library" \
            "Adafruit BusIO" \
            "ESP32Servo" \
            "ElegantOTA"

      - name: Configure ElegantOTA for async web server
        shell: bash
        run: |
          set -euo pipefail

          find ~/Arduino/libraries ~/.arduino15 \
            -path '*ElegantOTA/src/ElegantOTA.h' \
            -type f -print0 2>/dev/null |
          while IFS= read -r -d '' file; do
            sed -i \
              's/#define ELEGANTOTA_USE_ASYNC_WEBSERVER 0/#define ELEGANTOTA_USE_ASYNC_WEBSERVER 1/' \
              "$file"
          done

      - name: Compile ESP32 firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esp32-build"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --output-dir "$RUNNER_TEMP/esp32-build" \
            lego_technic_esp32

      - name: Prepare firmware download
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t firmware_bins < <(
            find "$RUNNER_TEMP/esp32-build" \
              -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#firmware_bins[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one *.ino.bin file"
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f
            exit 1
          fi

          mkdir -p downloads
          cp "${firmware_bins[0]}" \
            downloads/build_firmware_for_esp32.bin

          test -s downloads/build_firmware_for_esp32.bin
          sha256sum downloads/build_firmware_for_esp32.bin

      - name: Commit generated project files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html CHANGELOG.md README.md

          if git diff --cached --quiet; then
            echo "Generated files have no changes."
          else
            git commit -m "Auto-update GUI and project metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy GitHub Pages
    needs: build-and-package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy site and firmware
        id: deployment
        uses: actions/deploy-pages@v4
