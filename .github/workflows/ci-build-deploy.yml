name: Сборка, извлечение и публикация

on:
  push:
    branches:
      - main
      - feature/four-dc-motors
    paths:
      - 'lego_technic_esp32/**'
      - 'firmware/bootstrap/**'
      - 'tools/**'
      - '.github/workflows/**'
      - '.github/release-automation/**'
      - 'platformio.ini'
      - 'arduino-cli.yaml'
      - 'index.html'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_bootstrap:
        description: "Скомпилировать и проверить загрузочный образ OTA (только при изменении загрузчика)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Генерация файлов и сборка ESP32
    runs-on: ubuntu-latest

    steps:
      - name: Получение репозитория
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Определение изменённых файлов
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BUILD_BOOTSTRAP_INPUT: ${{ inputs.build_bootstrap }}
        run: |
          set -euo pipefail

          firmware=false
          generated=false
          site=false
          workflow_changed=false
          bootstrap_changed=false

          # Ручной запуск пересобирает основную прошивку и заново формирует файлы сайта.
          # Сборка отдельного загрузочного образа запускается только по запросу, поскольку main защищена.
          if [[ "$EVENT_NAME" != "push" ]]; then
            firmware=true
            generated=true
            site=true
            workflow_changed=true
            if [[ "$BUILD_BOOTSTRAP_INPUT" == "true" ]]; then
              bootstrap_changed=true
            fi
          else
            before="$EVENT_BEFORE"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              # Первый push в ветку обрабатывается как полное обновление.
              firmware=true
              generated=true
              site=true
              workflow_changed=true
              bootstrap_changed=true
            else
              changed_files="$(git diff --name-only "$before" "$GITHUB_SHA")"
              echo "Изменённые файлы:"
              printf '%s\n' "$changed_files"

              while IFS= read -r file; do
                [[ -z "$file" ]] && continue

                case "$file" in
                  lego_technic_esp32/*)
                    firmware=true
                    ;;
                esac

                case "$file" in
                  firmware/bootstrap/LEGO_Technic_ESP32_Bootstrap/LEGO_Technic_ESP32_Bootstrap.ino)
                    bootstrap_changed=true
                    site=true
                    ;;
                esac

                case "$file" in
                  lego_technic_esp32/lego_technic_esp32.ino|\
                  lego_technic_esp32/web_page.cpp|\
                  lego_technic_esp32/assets/*|\
                  tools/extract_html.py|\
                  tools/embed_web_gui_assets.py|\
                  tools/update_gui_version.py|\
                  tools/extract_changelog.py|\
                  tools/update_readme_version.py)
                    generated=true
                    ;;
                esac

                case "$file" in
                  index.html|README.md|CHANGELOG.md|docs/*|firmware/bootstrap/*)
                    site=true
                    ;;
                  .github/workflows/ci-build-deploy.yml)
                    site=true
                    workflow_changed=true
                    ;;
                esac
              done <<< "$changed_files"
            fi
          fi

          {
            echo "firmware=$firmware"
            echo "generated=$generated"
            echo "site=$site"
            echo "workflow_changed=$workflow_changed"
            echo "bootstrap_changed=$bootstrap_changed"
          } >> "$GITHUB_OUTPUT"

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Встраивание изображений веб-интерфейса
        if: ${{ steps.changes.outputs.generated == 'true' }}
        run: python3 tools/embed_web_gui_assets.py

      - name: Выбор источника HTML
        id: html_source
        if: ${{ steps.changes.outputs.generated == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -q 'PAGE_HTML' lego_technic_esp32/web_page.cpp; then
            echo "file=lego_technic_esp32/web_page.cpp" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Не найден PAGE_HTML в lego_technic_esp32/web_page.cpp"
            exit 1
          fi

      - name: Синхронизация версии интерфейса с lego_technic_esp32.ino
        if: ${{ steps.changes.outputs.generated == 'true' }}
        run: python3 tools/update_gui_version.py

      - name: Извлечение HTML веб-интерфейса
        if: ${{ steps.changes.outputs.generated == 'true' }}
        run: |
          python3 tools/extract_html.py \
            "${{ steps.html_source.outputs.file }}" \
            index.html

      - name: Извлечение журнала изменений
        if: ${{ steps.changes.outputs.generated == 'true' }}
        run: |
          python3 tools/extract_changelog.py \
            lego_technic_esp32/lego_technic_esp32.ino \
            CHANGELOG.md

      - name: Обновление версии в README
        if: ${{ steps.changes.outputs.generated == 'true' }}
        run: python3 tools/update_readme_version.py

      - name: Проверка наличия опубликованной прошивки
        id: existing_firmware
        if: ${{ github.ref == 'refs/heads/main' && steps.changes.outputs.firmware != 'true' && steps.changes.outputs.workflow_changed != 'true' && github.event_name == 'push' }}
        shell: bash
        env:
          # Используем основной бинарный файл из последнего релиза прошивки.
          # Копия Pages может отсутствовать или появиться с задержкой во время публикации сайта.
          FIRMWARE_URL: https://github.com/dsr987/lego-technic-esp32/releases/latest/download/lego_technic_esp32.ino.bin
        run: |
          set -uo pipefail
          if curl --fail --silent --show-error --location --max-time 30 \
              "${FIRMWARE_URL}?cachebust=${GITHUB_SHA}" \
              --output "$RUNNER_TEMP/current-firmware.bin" \
              && test -s "$RUNNER_TEMP/current-firmware.bin"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Найдена опубликованная прошивка, повторная компиляция не требуется."
          else
            rm -f "$RUNNER_TEMP/current-firmware.bin"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Опубликованной прошивки нет, выполняется первая сборка."
          fi

      - name: Определение целей компиляции
        id: build_decision
        shell: bash
        env:
          FIRMWARE_CHANGED: ${{ steps.changes.outputs.firmware }}
          BOOTSTRAP_CHANGED: ${{ steps.changes.outputs.bootstrap_changed }}
          WORKFLOW_CHANGED: ${{ steps.changes.outputs.workflow_changed }}
          EVENT_NAME: ${{ github.event_name }}
          BUILD_BOOTSTRAP_INPUT: ${{ inputs.build_bootstrap }}
          REF: ${{ github.ref }}
          EXISTING_FIRMWARE: ${{ steps.existing_firmware.outputs.exists }}
        run: |
          set -euo pipefail

          if [[ "$FIRMWARE_CHANGED" == "true" || \
                "$WORKFLOW_CHANGED" == "true" || \
                "$EVENT_NAME" == "workflow_dispatch" || \
                ( "$REF" == "refs/heads/main" && "$EXISTING_FIRMWARE" != "true" ) ]]; then
            app_build=true
          else
            app_build=false
          fi

          # Обновляем загрузочный образ только при изменении его исходников или при
          # явном запросе. Не связываем его с посторонними сборками основной прошивки.
          if [[ "$BOOTSTRAP_CHANGED" == "true" || \
                ( "$EVENT_NAME" == "workflow_dispatch" && "$BUILD_BOOTSTRAP_INPUT" == "true" ) ]]; then
            bootstrap_build=true
          else
            bootstrap_build=false
          fi

          if [[ "$app_build" == "true" || "$bootstrap_build" == "true" ]]; then
            toolchain=true
          else
            toolchain=false
          fi

          {
            echo "app_build=$app_build"
            echo "bootstrap_build=$bootstrap_build"
            echo "toolchain=$toolchain"
          } >> "$GITHUB_OUTPUT"

          echo "Собирать основную прошивку: $app_build"
          echo "Собирать загрузчик OTA: $bootstrap_build"
          echo "Устанавливать/собирать инструментарий: $toolchain"

      - name: Установка pySerial для esptool
        if: ${{ steps.build_decision.outputs.toolchain == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pyserial==3.5
          python -c "import serial; print('pySerial доступен:', serial.__version__)"
          python3 -c "import serial; print('python3 может импортировать pySerial:', serial.__version__)"

      - name: Установка arduino-cli
        if: ${{ steps.build_decision.outputs.toolchain == 'true' }}
        uses: arduino/setup-arduino-cli@v2

      - name: Настройка индекса плат ESP32
        if: ${{ steps.build_decision.outputs.toolchain == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Установка ядра ESP32 2.0.9
        if: ${{ steps.build_decision.outputs.toolchain == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9

      - name: Установка библиотек прошивки
        if: ${{ steps.build_decision.outputs.toolchain == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib install \
            "ESPAsyncWebServer@3.1.0" \
            "AsyncTCP@1.1.4" \
            "ArduinoJson" \
            "Adafruit SSD1306" \
            "Adafruit GFX Library" \
            "Adafruit BusIO" \
            "Adafruit Motor Shield V2 Library@1.1.4" \
            "ESP32Servo" \
            "ElegantOTA@3.1.0"

      - name: Компиляция прошивки ESP32
        if: ${{ steps.build_decision.outputs.app_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/esp32-build"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --output-dir "$RUNNER_TEMP/esp32-build" \
            lego_technic_esp32

      - name: Подготовка свежесобранной прошивки
        if: ${{ steps.build_decision.outputs.app_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t firmware_bins < <(
            find "$RUNNER_TEMP/esp32-build" \
              -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#firmware_bins[@]}" -ne 1 ]]; then
            echo "::error::Ожидался ровно один файл *.ino.bin, найдено: ${#firmware_bins[@]}."
            find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi

          mkdir -p downloads
          cp "${firmware_bins[0]}" downloads/build_firmware_for_esp32.bin
          test -s downloads/build_firmware_for_esp32.bin
          sha256sum downloads/build_firmware_for_esp32.bin

      - name: Использование опубликованной прошивки без повторной компиляции
        if: ${{ github.ref == 'refs/heads/main' && steps.build_decision.outputs.app_build == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp "$RUNNER_TEMP/current-firmware.bin" downloads/build_firmware_for_esp32.bin
          test -s downloads/build_firmware_for_esp32.bin
          echo "Для обновления только сайта используется существующая прошивка."

      - name: Подготовка артефакта прошивки
        if: ${{ steps.build_decision.outputs.app_build == 'true' || github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s downloads/build_firmware_for_esp32.bin

          mkdir -p "$RUNNER_TEMP/firmware-artifact"
          cp downloads/build_firmware_for_esp32.bin \
            "$RUNNER_TEMP/firmware-artifact/build_firmware_for_esp32.bin"

          # Храним временные файлы сборки вне корневого каталога GitHub Pages.
          if [[ -d "$RUNNER_TEMP/esp32-build" ]]; then
            mkdir -p "$RUNNER_TEMP/firmware-artifact/build-output"
            cp -a "$RUNNER_TEMP/esp32-build/." \
              "$RUNNER_TEMP/firmware-artifact/build-output/"
          fi

          cat > "$RUNNER_TEMP/firmware-artifact/README.txt" <<'EOF'
          build_firmware_for_esp32.bin is the compiled application image intended for OTA update of an already provisioned ESP32.
          The build-output directory contains additional Arduino CLI build files when they are available.
          For initial USB flashing, use the matching bootloader, partition table and application files with their correct flash offsets. Do not assume the application-only BIN is a complete flash image.
          EOF

      - name: Подготовка безопасного имени артефакта
        id: artifact_name
        shell: bash
        run: |
          set -euo pipefail
          safe_branch="$(printf '%s' "$GITHUB_REF_NAME" \
            | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          if [[ -z "$safe_branch" ]]; then
            safe_branch="branch"
          fi
          echo "branch=${safe_branch}" >> "$GITHUB_OUTPUT"
          echo "name=esp32-firmware-${safe_branch}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Безопасное имя ветки для артефакта: ${safe_branch}"

      - name: Компиляция загрузочной прошивки OTA
        if: ${{ steps.build_decision.outputs.bootstrap_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bootstrap-build"

          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings default \
            --build-property "compiler.cpp.extra_flags=-DELEGANTOTA_USE_ASYNC_WEBSERVER=1" \
            --output-dir "$RUNNER_TEMP/bootstrap-build" \
            firmware/bootstrap/LEGO_Technic_ESP32_Bootstrap

      - name: Подготовка артефакта загрузчика OTA и готового бинарного файла
        if: ${{ steps.build_decision.outputs.bootstrap_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t bootstrap_bins < <(
            find "$RUNNER_TEMP/bootstrap-build" \
              -maxdepth 1 -type f -name '*.ino.bin' -print
          )

          if [[ "${#bootstrap_bins[@]}" -ne 1 ]]; then
            echo "::error::Ожидался ровно один файл загрузчика *.ino.bin, найдено: ${#bootstrap_bins[@]}."
            find "$RUNNER_TEMP/bootstrap-build" -maxdepth 1 -type f -printf '%f\n' || true
            exit 1
          fi

          # Это только образ приложения. BAT-скрипт правильно компилирует и загружает
          # весь скетч при первоначальной прошивке через USB.
          mkdir -p firmware/bootstrap/prebuilt
          cp "${bootstrap_bins[0]}" firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin

          mkdir -p "$RUNNER_TEMP/bootstrap-artifact/source"
          cp "${bootstrap_bins[0]}" "$RUNNER_TEMP/bootstrap-artifact/esp32_ota_bootstrap.bin"
          cp firmware/bootstrap/README.md "$RUNNER_TEMP/bootstrap-artifact/README.md"
          cp firmware/bootstrap/flash_bootstrap.bat "$RUNNER_TEMP/bootstrap-artifact/"
          cp firmware/bootstrap/install_arduino_cli.ps1 "$RUNNER_TEMP/bootstrap-artifact/"
          cp firmware/bootstrap/patch_elegantota.ps1 "$RUNNER_TEMP/bootstrap-artifact/"
          cp firmware/bootstrap/LEGO_Technic_ESP32_Bootstrap/LEGO_Technic_ESP32_Bootstrap.ino \
            "$RUNNER_TEMP/bootstrap-artifact/source/"
          mkdir -p "$RUNNER_TEMP/bootstrap-artifact/build-output"
          cp -a "$RUNNER_TEMP/bootstrap-build/." "$RUNNER_TEMP/bootstrap-artifact/build-output/"

          cat > "$RUNNER_TEMP/bootstrap-artifact/ARTIFACT_INFO.txt" <<'EOF'
          esp32_ota_bootstrap.bin is an application-only image, not a complete flash image for a blank ESP32.
          Use flash_bootstrap.bat on Windows for first-time USB flashing. The script compiles the sketch and uses Arduino CLI to handle the flash layout.
          This bootstrap uses the project's current Wi-Fi AP and OTA credentials; see README.md before distributing the firmware.
          EOF

      - name: Проверка готового бинарного файла загрузчика OTA
        if: ${{ steps.build_decision.outputs.bootstrap_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin

          if git diff --cached --quiet; then
            echo "Готовый бинарный файл загрузчика не изменился."
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "::error::The generated OTA bootstrap binary differs from the committed prebuilt image. Update firmware/bootstrap/prebuilt/esp32_ota_bootstrap.bin in a source PR; this workflow must not push directly to protected main."
            exit 1
          else
            git commit -m "Update prebuilt ESP32 OTA bootstrap firmware"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Загрузка артефакта загрузчика OTA
        if: ${{ steps.build_decision.outputs.bootstrap_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: esp32-ota-bootstrap-${{ steps.artifact_name.outputs.branch }}-${{ github.run_number }}
          path: ${{ runner.temp }}/bootstrap-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Загрузка артефакта прошивки
        if: ${{ steps.build_decision.outputs.app_build == 'true' || github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: ${{ runner.temp }}/firmware-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Проверка сгенерированных файлов проекта
        if: ${{ steps.changes.outputs.generated == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lego_technic_esp32/web_page.cpp index.html CHANGELOG.md README.md

          if git diff --cached --quiet; then
            echo "Сгенерированные файлы не изменились."
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "::error::Generated files are out of sync with the source. Regenerate and commit web_page.cpp, index.html, CHANGELOG.md and README.md in the source PR; this workflow must not push directly to protected main."
            exit 1
          else
            git commit -m "Auto-update GUI and project metadata"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Настройка GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy GitHub Pages
    needs: build-and-package
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Публикация сайта и прошивки
        id: deployment
        uses: actions/deploy-pages@v4