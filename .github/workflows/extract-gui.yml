name: Extract GUI HTML and CHANGELOG

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lego_technic_esp32/app.cpp'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract HTML from app.cpp
        run: |
          python3 extract_html.py lego_technic_esp32/app.cpp index.html

      - name: Extract CHANGELOG from app.cpp
        run: |
          python3 extract_changelog.py lego_technic_esp32/app.cpp CHANGELOG.md

- name: Update README version
        run: |
          python3 update_readme_version.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update GUI, CHANGELOG and README version [skip ci]"
          git push

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-update GUI demo and CHANGELOG [skip ci]"
          git push