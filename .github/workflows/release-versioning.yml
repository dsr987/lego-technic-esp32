name: Release Version Automation

on:
  # Process merged PRs from the trusted main push, including the first PR
  # that installs this workflow. No privileged pull_request_target is needed.
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

# Coordinate main-changing release commits with the existing build/deploy workflow.
concurrency:
  group: github-pages-deployment
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Resolve merged PR and update version metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve PR associated with this main commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100" \
            > "${RUNNER_TEMP}/associated-prs.json"
          python3 tools/release_automation.py prepare-push "${RUNNER_TEMP}/associated-prs.json"

      - name: Create standard release labels if missing
        if: ${{ steps.resolve.outputs.process == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ensure_label() {
            local name="$1" color="$2" description="$3"
            if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/labels?per_page=100" --jq '.[].name' | grep -Fx "${name}" >/dev/null; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f "name=${name}" -f "color=${color}" -f "description=${description}" >/dev/null
              echo "Created label: ${name}"
            else
              echo "Label already exists: ${name}"
            fi
          }
          ensure_label "release:patch" "0E8A16" "Patch release: backward-compatible fixes"
          ensure_label "release:minor" "1D76DB" "Minor release: new backward-compatible functionality"
          ensure_label "release:major" "B60205" "Major release: breaking changes after v1.0.0"
          ensure_label "release:stable" "5319E7" "Promote beta 0.x to stable v1.0.0"
          ensure_label "release:none" "C5DEF5" "No firmware release; documentation or automation only"

      - name: Apply release metadata
        id: update
        if: ${{ steps.resolve.outputs.process == 'true' }}
        run: python3 tools/release_automation.py apply

      - name: Commit version and release state
        if: ${{ steps.resolve.outputs.process == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lego_technic_esp32/app.cpp .github/release-automation/state.json
          if git diff --cached --quiet; then
            echo "Release metadata is already committed."
          else
            git commit -m "chore: update release metadata for PR #${PR_NUMBER}"
            git push origin HEAD:main
          fi

      - name: Regenerate changelog, README and GUI; rebuild and deploy
        if: ${{ steps.resolve.outputs.process == 'true' && steps.update.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci-build-deploy.yml --ref main
