name: Release Metadata Validation

# The branch protection rules still require this check name.
# Metadata validation is disabled automatically; release automation remains active.
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
      - labeled

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate release type and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Mark automatic release-metadata validation as disabled
        run: |
          echo "Automatic release-metadata validation is disabled by project policy."
          echo "Release labels and metadata are still managed by the release automation."
          echo "Run python tools/run_regression_checks.py manually before an official firmware release."
