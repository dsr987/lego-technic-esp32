name: Сборка тестовых скетчей ESP32

on:
  push:
    branches:
      - main
    paths:
      - 'test/**/*.ino'
      - 'test/**/README.md'
      - 'test/**/src/**'
      - 'test/**/lib/**'
      - '.github/workflows/compile-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'test/**/*.ino'
      - 'test/**/README.md'
      - 'test/**/src/**'
      - 'test/**/lib/**'

# Более новые исходники заменяют старые сборки. Не допускаем параллельные запуски для main.
concurrency:
  group: compile-test-sketches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    name: Компиляция отдельных тестовых скетчей
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: arduino/setup-arduino-cli@v2

      - name: Настройка Arduino CLI
        run: arduino-cli config init

      - name: Установка ядра ESP32 и библиотек
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9
          arduino-cli lib update-index
          arduino-cli lib install "ESP32Servo"

      - name: Компиляция тестовых скетчей
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          failed=0

          while IFS= read -r -d '' ino; do
            count=$((count + 1))
            sketch_dir="$(dirname "$ino")"
            ino_name="$(basename "$ino" .ino)"
            dir_name="$(basename "$sketch_dir")"

            echo "::group::Компиляция $ino"
            if [[ "$ino_name" != "$dir_name" ]]; then
              echo "::error file=$ino::Имя файла скетча должно совпадать с именем каталога."
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            # Храним промежуточные файлы компилятора вне репозитория. В каталог скетча
            # копируется только бинарный файл приложения OTA.
            output_dir="$RUNNER_TEMP/test-sketch-build/$ino_name"
            mkdir -p "$output_dir"
            if arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$output_dir" "$sketch_dir"; then
              compiled_bin="$output_dir/$ino_name.ino.bin"
              if [[ ! -s "$compiled_bin" ]]; then
                echo "::error file=$ino::Не найден ожидаемый бинарный файл: $compiled_bin"
                failed=$((failed + 1))
              else
                cp "$compiled_bin" "$sketch_dir/$ino_name.bin"
                echo "Собран файл: $sketch_dir/$ino_name.bin"
              fi
            else
              echo "::error file=$ino::Ошибка компиляции."
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < <(find test -type f -name '*.ino' -not -path '*/build/*' -print0 | sort -z)

          if [[ "$count" -eq 0 ]]; then
            echo "В каталоге test/ не найдены скетчи .ino."
            exit 0
          fi
          echo "Скетчей: $count; ошибок: $failed"
          [[ "$failed" -eq 0 ]]

      - name: Фиксация обновлённых бинарных файлов OTA
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Фиксируем только целевые BIN-файлы приложения, но не загрузчик,
          # таблицу разделов, объединённые образы и другие промежуточные файлы.
          while IFS= read -r -d '' bin; do
            git add -f -- "$bin"
          done < <(find test -type f -name '*.bin' -not -path '*/build/*' -print0 | sort -z)

          if git diff --cached --quiet; then
            echo "Тестовые бинарные файлы не изменились, коммит не требуется."
            exit 0
          fi

          git commit -m "Update ESP32 test binaries"

          # Перебазируемся на посторонние коммиты, появившиеся во время компиляции.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
