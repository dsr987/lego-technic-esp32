name: Build ESP32 test sketches

on:
  push:
    branches:
      - main
    paths:
      - 'test/**/*.ino'
      - 'test/**/README.md'
      - 'test/**/src/**'
      - 'test/**/lib/**'
      - '.github/workflows/compile-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'test/**/*.ino'
      - 'test/**/README.md'
      - 'test/**/src/**'
      - 'test/**/lib/**'

# Newer source changes supersede older builds. Prevent parallel pushes to main.
concurrency:
  group: compile-test-sketches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile:
    name: Compile standalone test sketches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: arduino/setup-arduino-cli@v2

      - name: Configure Arduino CLI
        run: arduino-cli config init

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.9
          arduino-cli lib update-index
          arduino-cli lib install "ESP32Servo"

      - name: Compile test sketches
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          failed=0

          while IFS= read -r -d '' ino; do
            count=$((count + 1))
            sketch_dir="$(dirname "$ino")"
            ino_name="$(basename "$ino" .ino)"
            dir_name="$(basename "$sketch_dir")"

            echo "::group::Compile $ino"
            if [[ "$ino_name" != "$dir_name" ]]; then
              echo "::error file=$ino::Sketch file and directory names must match."
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi

            # Keep compiler intermediates outside the repository. Only the OTA
            # application binary is copied back into the sketch directory.
            output_dir="$RUNNER_TEMP/test-sketch-build/$ino_name"
            mkdir -p "$output_dir"
            if arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir "$output_dir" "$sketch_dir"; then
              compiled_bin="$output_dir/$ino_name.ino.bin"
              if [[ ! -s "$compiled_bin" ]]; then
                echo "::error file=$ino::Expected binary not found: $compiled_bin"
                failed=$((failed + 1))
              else
                cp "$compiled_bin" "$sketch_dir/$ino_name.bin"
                echo "Built $sketch_dir/$ino_name.bin"
              fi
            else
              echo "::error file=$ino::Compilation failed."
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < <(find test -type f -name '*.ino' -not -path '*/build/*' -print0 | sort -z)

          if [[ "$count" -eq 0 ]]; then
            echo "No .ino sketches found under test/."
            exit 0
          fi
          echo "Sketches: $count; failures: $failed"
          [[ "$failed" -eq 0 ]]

      - name: Commit updated OTA binaries
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit only the intended application BINs, never bootloader,
          # partition-table, merged or other intermediate images.
          while IFS= read -r -d '' bin; do
            git add -f -- "$bin"
          done < <(find test -type f -name '*.bin' -not -path '*/build/*' -print0 | sort -z)

          if git diff --cached --quiet; then
            echo "Test binaries unchanged; no commit needed."
            exit 0
          fi

          git commit -m "Update ESP32 test binaries"

          # Rebase on any unrelated commits that landed while compiling.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
