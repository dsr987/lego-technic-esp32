<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">CI/CD: сборка, синхронизация и публикация</title>
  <desc id="desc">Workflow Build, Extract and Deploy обрабатывает изменения, синхронизирует производные файлы, собирает прошивку и публикует GitHub Pages. После успешной сборки на main отдельные workflow обрабатывают метаданные версии и публикуют GitHub Release только при появлении новой версии и свежего бинарного артефакта.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .t{font:600 16px system-ui,sans-serif;fill:#0f172a}
      .s{font:13px system-ui,sans-serif;fill:#334155}
      .m{font:12px system-ui,sans-serif;fill:#475569}
      .line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .b{stroke-width:1.5;rx:13}
    </style>
  </defs>
  <rect width="1000" height="390" rx="20" fill="#f8fafc"/>
  <text x="500" y="32" text-anchor="middle" class="t" style="font-size:22px">Автоматизация проекта</text>

  <rect x="25" y="70" width="145" height="70" class="b" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="97" y="98" text-anchor="middle" class="t">Push в main</text>
  <text x="97" y="120" text-anchor="middle" class="s">GitHub Actions</text>

  <path d="M170 105 H205" class="line"/>

  <rect x="210" y="70" width="175" height="70" class="b" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="297" y="97" text-anchor="middle" class="t">Анализ diff</text>
  <text x="297" y="120" text-anchor="middle" class="s">фильтры изменений</text>

  <path d="M385 105 H420" class="line"/>

  <rect x="425" y="57" width="230" height="96" class="b" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="540" y="84" text-anchor="middle" class="t">Синхронизация</text>
  <text x="540" y="107" text-anchor="middle" class="s">HTML · README · CHANGELOG</text>
  <text x="540" y="130" text-anchor="middle" class="m">по необходимости</text>

  <path d="M540 153 V181" class="line"/>

  <rect x="410" y="185" width="260" height="70" class="b" fill="#dcfce7" stroke="#4ade80"/>
  <text x="540" y="213" text-anchor="middle" class="t">Сборка прошивки ESP32</text>
  <text x="540" y="236" text-anchor="middle" class="s">артефакт + проверка источника</text>

  <path d="M410 220 H350 V292 H330" class="line"/>
  <path d="M670 220 H700 V292 H720" class="line"/>

  <rect x="75" y="285" width="255" height="74" class="b" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="202" y="313" text-anchor="middle" class="t">GitHub Pages</text>
  <text x="202" y="337" text-anchor="middle" class="s">демо GUI и файл прошивки</text>

  <rect x="720" y="285" width="245" height="74" class="b" fill="#fce7f3" stroke="#f472b6"/>
  <text x="842" y="312" text-anchor="middle" class="t">Release workflow</text>
  <text x="842" y="335" text-anchor="middle" class="s">только новая версия</text>
  <text x="842" y="352" text-anchor="middle" class="m">свежая сборка на main</text>
</svg>