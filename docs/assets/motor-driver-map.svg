<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Каналы моторов и драйверы</title>
  <desc id="desc">Моторы A и B подключены к первому TB6612FNG, моторы C и D ко второму. Оба используют общий STBY GPIO4.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.t{font:600 18px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.wire{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arr)}.b{stroke-width:1.5;rx:14}</style></defs>
  <rect width="1000" height="470" rx="20" fill="#f8fafc"/>
  <text x="500" y="38" text-anchor="middle" class="t">Разделение четырёх DC-моторов по драйверам</text>
  <rect x="50" y="90" width="390" height="100" class="b" fill="#dbeafe" stroke="#60a5fa"/><text x="245" y="122" text-anchor="middle" class="t">TB6612FNG №1</text><text x="245" y="149" text-anchor="middle" class="s">A: IN1=GPIO16 · IN2=GPIO17 · PWM=GPIO18</text><text x="245" y="172" text-anchor="middle" class="s">B: IN1=GPIO19 · IN2=GPIO21 · PWM=GPIO22</text>
  <rect x="560" y="90" width="390" height="100" class="b" fill="#dcfce7" stroke="#4ade80"/><text x="755" y="122" text-anchor="middle" class="t">TB6612FNG №2</text><text x="755" y="149" text-anchor="middle" class="s">C: IN1=GPIO13 · IN2=GPIO14 · PWM=GPIO23</text><text x="755" y="172" text-anchor="middle" class="s">D: IN1=GPIO32 · IN2=GPIO33 · PWM=GPIO1</text>
  <path d="M150 190 V239 H245 V270 M340 190 V239 H245" class="wire"/><path d="M660 190 V239 H755 V270 M850 190 V239 H755" class="wire"/>
  <rect x="125" y="275" width="240" height="78" class="b" fill="#f1f5f9" stroke="#94a3b8"/><text x="245" y="307" text-anchor="middle" class="t">Моторы A и B</text><text x="245" y="332" text-anchor="middle" class="s">Независимое управление</text>
  <rect x="635" y="275" width="240" height="78" class="b" fill="#f1f5f9" stroke="#94a3b8"/><text x="755" y="307" text-anchor="middle" class="t">Моторы C и D</text><text x="755" y="332" text-anchor="middle" class="s">Независимое управление</text>
  <path d="M245 353 V388 H500 M755 353 V388 H500 V409" class="wire"/>
  <rect x="330" y="410" width="340" height="42" rx="11" fill="#fef3c7" stroke="#fbbf24"/><text x="500" y="437" text-anchor="middle" class="t">Общий STBY — GPIO4</text>
</svg>
